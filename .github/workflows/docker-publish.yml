name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Normalize Image Names
        id: meta
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          GHCR_ID=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ghcr_id=${GHCR_ID}" >> "$GITHUB_OUTPUT"
          if [ -n "${DH_USER}" ]; then
            DH_ID=$(echo "docker.io/${DH_USER}/${REPO_NAME}" | tr '[:upper:]' '[:lower:]')
            echo "dh_id=${DH_ID}" >> "$GITHUB_OUTPUT"
            echo "has_dh=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_dh=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: steps.meta.outputs.has_dh == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push to GHCR
        if: steps.meta.outputs.has_dh != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.ghcr_id }}:latest

      - name: Build and Push to Docker Hub and GHCR
        if: steps.meta.outputs.has_dh == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ steps.meta.outputs.dh_id }}:latest
            ${{ steps.meta.outputs.ghcr_id }}:latest
